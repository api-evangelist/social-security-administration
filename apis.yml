apis:
- aid: social-security-administration:oasdi-data-api
  name: SSA OASDI Open Data API
  description: >-
    Provides statistics on Old Age, Survivors, and Disability Insurance (OASDI) beneficiaries including
    counts by state, total population data, and benefit payment statistics. Available through SSA's open
    data portal and Esri Feature Services.
  humanURL: https://www.ssa.gov/data/OASDIBeneficiariesbyState.htm
  tags:
  - OASDI
  - Beneficiary Statistics
  - Open Data
  - Benefits Data
  properties:
  - type: Documentation
    url: https://www.ssa.gov/data/OASDIBeneficiariesbyState.htm
  - type: Open Data Portal
    url: https://www.ssa.gov/data/
- aid: social-security-administration:ecbsv-api
  name: SSA eCBSV Verification API
  description: >-
    The Electronic Consent Based SSN Verification (eCBSV) Service allows financial institutions to verify
    that a provided Social Security Number, name, and date of birth match SSA records, with consent from
    the individual. Access is restricted to eligible financial institutions.
  humanURL: https://www.ssa.gov/dataexchange/eCBSV/
  tags:
  - SSN Verification
  - Identity Verification
  - Financial Services
  - Consent Based
  properties:
  - type: Documentation
    url: https://www.ssa.gov/dataexchange/eCBSV/technical_information.html
  - type: CBSV Web Service
    url: https://www.ssa.gov/cbsv/webservice.html
